---
services:
  freqtrade:
    # Build from local Dockerfile instead of using the freqtradeorg/freqtrade:stable image
    build:
      context: .
      dockerfile: Dockerfile
    # image: freqtradeorg/freqtrade:stable  # Commented out pre-built image
    # image: freqtradeorg/freqtrade:develop
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    restart: unless-stopped
    container_name: freqtrade
    env_file:
      - .env
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./config.json:/freqtrade/config.json"
      - "./tradesv3.dryrun.sqlite:/freqtrade/tradesv3.dryrun.sqlite"
      - "./tradesv3.dryrun.sqlite-shm:/freqtrade/tradesv3.dryrun.sqlite-shm"
      - "./tradesv3.dryrun.sqlite-wal:/freqtrade/tradesv3.dryrun.sqlite-wal"
    # Expose only web UI port since we had an issue with 8080
    ports:
      - "8081:8081"
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/tradesv3.dryrun.sqlite
      --config /freqtrade/config.json
      --strategy ${STRATEGY}
